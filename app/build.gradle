apply plugin: 'com.android.application'

def localProperties = new Properties()
file("${rootProject.projectDir}/local.properties").with { f ->
    if (f.exists()) {
        f.withInputStream { localProperties.load(it) }
    }
}

android {
    namespace 'com.shivam.sfl'
    compileSdk 34

    defaultConfig {
        applicationId "com.shivam.sfl"
        minSdkVersion 23
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Kept out of the manifest/source so it never lands in version control.
        // Set MAPS_API_KEY in local.properties (see local.properties.sample).
        manifestPlaceholders = [MAPS_API_KEY: localProperties.getProperty("MAPS_API_KEY", "")]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // AndroidX core / UI
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.12.0'

    // Google Play Services - Maps & Location
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Google Sign-In + Drive App Data scope for opt-in cloud backup (no Drive REST client
    // library pulled in - the backup itself is done with plain HttpURLConnection calls to
    // keep the dependency footprint small).
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // Plus Code support (Open Location Code)
    implementation 'com.google.openlocationcode:openlocationcode:1.0.4'

    // Third-party onboarding/tutorial highlight library
    implementation 'com.github.amlcurran.showcaseview:library:5.4.3'

    // QR code generation for shareable collections - fully offline, no account/API key needed
    implementation 'com.google.zxing:core:3.5.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
